<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On the trail · breadcrumb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F2; font-family: Inter, system-ui, sans-serif; color: #1B1916; -webkit-font-smoothing: antialiased">

  <div style="position: relative; height: 420px; background: #EFEDE6">
    <svg width="390" height="420" viewBox="0 0 390 420" role="img" aria-label="Live map: stop 1 done, you are walking to stop 2, stop 3 is next" style="position: absolute; inset: 0">
      <rect width="390" height="420" fill="#EFEDE6"></rect>
      <circle cx="380" cy="40" r="128" fill="#D8E6F0"></circle>
      <rect x="96" y="150" width="160" height="112" rx="24" fill="#DDE8D3"></rect>
      <path d="M0 300H390M276 0V420M0 92H60" stroke="#FBFAF7" stroke-width="10"></path>
      <path d="M160 300V420M30 0V92" stroke="#FBFAF7" stroke-width="6"></path>
      <path d="M70 120Q120 150 165 190" fill="none" stroke="#15803D" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 9"></path>
      <path d="M165 190Q181 202 196 214Q262 262 318 352" fill="none" stroke="#E8552D" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 9"></path>
      <circle cx="70" cy="120" r="14" fill="#15803D"></circle>
      <path d="M64 120l4 4 8-8" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="196" cy="214" r="15" fill="#C2410C"></circle>
      <circle cx="318" cy="352" r="14" fill="#FFFFFF" stroke="#E8552D" stroke-width="2.8"></circle>
      <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><text x="196" y="218.6" fill="#FFFFFF">2</text><text x="318" y="356.6" fill="#1B1916">3</text></g>
      <circle cx="165" cy="190" r="18" fill="#1B1916" fill-opacity="0.1"></circle>
      <circle cx="165" cy="190" r="7.5" fill="#1B1916" stroke="#FFFFFF" stroke-width="3"></circle>
    </svg>
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Mobile-Detail.dc.html" aria-label="Leave trail" style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #1B1916; box-shadow: 0 4px 14px rgba(27,25,22,0.14)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </a>
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(27,25,22,0.14); font-size: 14px; font-weight: 600; white-space: nowrap">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #C2410C"></span>Sunday Café Hop · 38 min
      </div>
      <button type="button" aria-label="Recenter map" style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 14px rgba(27,25,22,0.14); cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      </button>
    </div>
  </div>

  <section style="position: relative; margin-top: -24px; padding: 20px 16px 0; background: #F7F6F2; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(27,25,22,0.06)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #C2410C">Stop 2 of 3 · next up</p>
      <svg width="104" height="20" viewBox="0 0 104 20" role="img" aria-label="Progress: 1 of 3 stops done">
        <path d="M10 10H52" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 7"></path>
        <path d="M52 10H94" fill="none" stroke="#E8552D" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 7"></path>
        <circle cx="10" cy="10" r="7" fill="#15803D"></circle>
        <circle cx="52" cy="10" r="7" fill="#C2410C"></circle>
        <circle cx="94" cy="10" r="6.5" fill="#FFFFFF" stroke="#E8552D" stroke-width="2.5"></circle>
      </svg>
    </div>
    <h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1">Public Garden</h1>
    <p style="margin: 4px 0 0; font-size: 15px; color: #57534C">Lagoon &amp; footbridge · 3 min walk</p>

    <div style="margin-top: 16px; padding: 14px 16px 8px; background: #FFFFFF; border: 1px solid #E7E4DD; border-radius: 20px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700">Crumbs here</h2>
        <span style="font-size: 13px; color: #736E66">{{doneLabel}}</span>
      </div>
      <button type="button" aria-pressed="{{crumbA}}" onClick="{{toggleA}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 0; border: 0; border-bottom: 1px solid #E7E4DD; background: transparent; text-align: left; cursor: pointer">
        <sc-if value="{{crumbA}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #15803D; color: #FFFFFF"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
        <sc-if value="{{crumbAOpen}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #E8552D; background: #FFFFFF"></span></sc-if>
        <span style="font-size: 15px; line-height: 1.3">Find the Make Way for Ducklings statues</span>
      </button>
      <button type="button" aria-pressed="{{crumbB}}" onClick="{{toggleB}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 0; border: 0; background: transparent; text-align: left; cursor: pointer">
        <sc-if value="{{crumbB}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #15803D; color: #FFFFFF"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
        <sc-if value="{{crumbBOpen}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #E8552D; background: #FFFFFF"></span></sc-if>
        <span style="flex: 1; font-size: 15px; line-height: 1.3">Take a photo on the footbridge</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#736E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      </button>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 16px">
      <a href="Mobile-Finished.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #C2410C; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">I'm here</a>
      <button type="button" aria-label="Directions to Public Garden" style="flex: none; display: grid; place-items: center; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D6D2C8; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"></path><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"></path></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { crumbA: true, crumbB: false };
  }
  renderVals() {
    const a = !!this.state.crumbA;
    const b = !!this.state.crumbB;
    const done = (a ? 1 : 0) + (b ? 1 : 0);
    return {
      crumbA: a,
      crumbB: b,
      crumbAOpen: !a,
      crumbBOpen: !b,
      doneLabel: done + ' of 2 done',
      toggleA: () => this.setState({ crumbA: !a }),
      toggleB: () => this.setState({ crumbB: !b })
    };
  }
}
</script>
</body>
</html>
