<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trail finished · breadcrumb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:#C2410C}a:hover{color:#9A3412}
textarea::placeholder{color:#736E66}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F2; font-family: Inter, system-ui, sans-serif; color: #1B1916; -webkit-font-smoothing: antialiased">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0">
    <a href="Main.dc.html" aria-label="Close" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E7E4DD; background: #FFFFFF; color: #1B1916">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </a>
    <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D6D2C8; font-size: 15px; font-weight: 600; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line></svg>Share
    </button>
  </header>

  <div style="padding: 20px 16px 0">
    <svg width="358" height="64" viewBox="0 0 358 64" role="img" aria-label="All three stops done" style="display: block">
      <path d="M14 40C70 20 120 18 179 34C238 50 290 44 338 26" fill="none" stroke="#15803D" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 9"></path>
      <circle cx="14" cy="40" r="10" fill="#15803D"></circle>
      <circle cx="179" cy="34" r="10" fill="#15803D"></circle>
      <circle cx="338" cy="26" r="16" fill="#15803D"></circle>
      <path d="M330 26l5.5 5.5 10-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <p style="margin: 16px 0 0; font-size: 13px; font-weight: 600; color: #15803D">Trail finished · Sun, Nov 22</p>
    <h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1">Sunday Café Hop</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 15px; font-weight: 600; color: #57534C">
      <span>3 stops</span><span>2 of 2 crumbs</span><span>2 hr 10 min</span>
    </div>
  </div>

  <section aria-labelledby="rate-title" style="margin: 20px 16px 0; padding: 14px 16px 8px; background: #FFFFFF; border: 1px solid #E7E4DD; border-radius: 20px">
    <h2 id="rate-title" style="margin: 0 0 4px; font-size: 17px; font-weight: 700">How was it?</h2>
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid #E7E4DD">
        <span style="font-size: 15px; font-weight: 600">{{row.label}}</span>
        <div style="display: flex">
          <sc-for list="{{row.stars}}" as="star" hint-placeholder-count="5">
            <button type="button" aria-label="{{star.label}}" aria-pressed="{{star.on}}" onClick="{{star.pick}}" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
              <sc-if value="{{star.on}}" hint-placeholder-val="{{ true }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="#C2410C" stroke="#C2410C" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></sc-if>
              <sc-if value="{{star.off}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D6D2C8" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></sc-if>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </section>

  <div style="margin: 16px 16px 0">
    <label for="note" style="display: block; font-size: 15px; font-weight: 600">Add a note <span style="font-weight: 400; color: #736E66">(optional)</span></label>
    <textarea id="note" rows="3" placeholder="The ducklings had tiny scarves on…" style="display: block; width: 100%; margin-top: 8px; padding: 12px 14px; border: 1px solid #D6D2C8; border-radius: 14px; background: #FFFFFF; font-size: 15px; line-height: 1.4; resize: none"></textarea>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 4px; padding: 16px 16px 20px">
    <a href="Mobile-Profile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #C2410C; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Post review</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #C2410C; text-decoration: none">Skip for now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fun: 5, value: 4, travel: 4 };
  }
  renderVals() {
    const defs = [
      { key: 'fun', label: 'Fun' },
      { key: 'value', label: 'Worth it' },
      { key: 'travel', label: 'Getting there' }
    ];
    const rows = defs.map((d) => {
      const score = this.state[d.key] || 0;
      const stars = [1, 2, 3, 4, 5].map((n) => ({
        on: n <= score,
        off: n > score,
        label: d.label + ': ' + n + ' of 5',
        pick: () => this.setState({ [d.key]: n })
      }));
      return { label: d.label, stars: stars };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
