<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadcrumb Mockups</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--color-sand); font-family: var(--font-sans); color: var(--color-ink); }
  .wrap { max-width: 1520px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0; font-size: clamp(2rem, 1.5rem + 2vw, 2.75rem); font-weight: 800; letter-spacing: -0.035em; }
  .lede { margin: 8px 0 0; max-width: 70ch; color: var(--color-ink-2); }
  h2 { margin: 48px 0 16px; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
  .row { display: flex; flex-wrap: wrap; gap: 32px 24px; }
  figure { margin: 0; }
  figcaption { margin: 0 4px 8px; font-size: 14px; font-weight: 600; color: var(--color-ink-2); }
  figcaption a { color: inherit; }
  .phone { display: block; width: 390px; max-width: calc(100vw - 32px); height: 844px; border: 0; border-radius: 40px; background: var(--color-paper); box-shadow: 0 20px 50px rgba(27,25,22,.12); }
  .page { display: block; width: 100%; height: 1000px; border: 1px solid var(--color-line); border-radius: 16px; background: var(--color-paper); }
  .web { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Breadcrumb mockups</h1>
  <p class="lede">These mobile and web screens use the Dotted trail design system. Click a title to open a screen on its own. Links inside the screens jump between them.</p>

  <h2>Mobile app</h2>
  <div class="row">
    <figure><figcaption><a href="Main.dc.html">Explore</a></figcaption><iframe class="phone" src="Main.dc.html" title="Mobile Explore" loading="lazy"></iframe></figure>
    <figure><figcaption><a href="Mobile-Detail.dc.html">Trail detail</a></figcaption><iframe class="phone" src="Mobile-Detail.dc.html" title="Mobile trail detail" loading="lazy"></iframe></figure>
    <figure><figcaption><a href="Mobile-Run.dc.html">On the trail</a></figcaption><iframe class="phone" src="Mobile-Run.dc.html" title="Mobile on the trail" loading="lazy"></iframe></figure>
    <figure><figcaption><a href="Mobile-Finished.dc.html">Trail finished</a></figcaption><iframe class="phone" src="Mobile-Finished.dc.html" title="Mobile trail finished" loading="lazy"></iframe></figure>
    <figure><figcaption><a href="Mobile-Create.dc.html">Make a trail</a></figcaption><iframe class="phone" src="Mobile-Create.dc.html" title="Mobile make a trail" loading="lazy"></iframe></figure>
    <figure><figcaption><a href="Mobile-Profile.dc.html">You</a></figcaption><iframe class="phone" src="Mobile-Profile.dc.html" title="Mobile profile" loading="lazy"></iframe></figure>
  </div>

  <h2>Web app</h2>
  <div class="row">
    <figure class="web"><figcaption><a href="Web-Explore.dc.html">Explore</a></figcaption><iframe class="page" src="Web-Explore.dc.html" title="Web Explore" loading="lazy" style="height:900px"></iframe></figure>
    <figure class="web"><figcaption><a href="Web-Detail.dc.html">Trail detail</a></figcaption><iframe class="page" src="Web-Detail.dc.html" title="Web trail detail" loading="lazy" style="height:1300px"></iframe></figure>
    <figure class="web"><figcaption><a href="Web-Create.dc.html">Make a trail</a></figcaption><iframe class="page" src="Web-Create.dc.html" title="Web make a trail" loading="lazy" style="height:1150px"></iframe></figure>
  </div>
</div>
</body>
</html>
